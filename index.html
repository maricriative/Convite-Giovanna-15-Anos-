<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F3057">
<meta name="msapplication-navbutton-color" content="#0F3057">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Convite 15 Anos — Giovanna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600;700&family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   🇬🇷 PALETA DE CORES MAMMA MIA (SANTORINI: BRANCO, AZUL GREGO & BOUGANVÍLEA PINK)
   ========================================================================== */
:root {
  --fundo-principal: #f8fafc;
  --fundo-card:      rgba(255, 255, 255, 0.92);

  --azul-cobalto:    #0F3057;
  --azul-greco:      #1b4965;
  --azul-celeste:    #62b6cb;

  --pink-bouganville:#e61975;
  --pink-brilho:     #ff4097;

  --texto-escuro:    #0a192f;
  --texto-suave:     #2b4c6f;
  --borda-glass:     rgba(27, 73, 101, 0.2);
  --sombra-glow:     0 10px 30px rgba(27, 73, 101, 0.12);

  --fonte-nome:    'Cinzel Decorative', serif;
  --fonte-titulo:  'Cinzel', serif;
  --fonte-corpo:   'Montserrat', sans-serif;
}

/* Reset Base */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
/* Fundo azul no html: colore a barra do navegador (topo e rodapé) e a área de rolagem extra */
html { scroll-behavior: smooth; background: #0F3057; }
body {
  background: var(--fundo-principal);
  color: var(--texto-escuro);
  font-family: var(--fonte-corpo);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.locked { overflow: hidden; }
img, video { max-width: 100%; display: block; }
button { font: inherit; cursor: pointer; border: none; background: none; }

body::before {
  content: ""; position: fixed; inset: 0; z-index: -3;
  background: radial-gradient(circle at 50% 10%, rgba(98, 182, 203, 0.15), transparent 70%),
              radial-gradient(circle at 80% 90%, rgba(230, 25, 117, 0.08), transparent 60%);
  pointer-events: none;
}

/* ---------- PATTERN DE AZULEJOS ---------- */
#pattern-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: -2;
  background-repeat: repeat; background-position: center;
  opacity: 0.06;
}

/* ---------- ✉️ TELA DE ABERTURA ---------- */
#intro {
  position: fixed; inset: 0; z-index: 200;
  background: #0F3057;
  display: flex; align-items: center; justify-content: center;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  transition: transform 1.1s cubic-bezier(0.77, 0, 0.18, 1), opacity 0.8s ease;
}

#videoAberturaPlayer {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 10;
  display: none; background: #000;
}

/* Área de clique invisível (sem animação) */
.area-selo-clique {
  position: relative; z-index: 5;
  width: 130px; height: 130px; border-radius: 50%;
  background: transparent;
  cursor: pointer;
}

#intro.open { transform: translateY(-100%); opacity: 0; }

/* ---------- 🌟 CAPA HERO ---------- */
.hero {
  min-height: 100svh; width: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: space-between;
  text-align: center;
  color: var(--azul-cobalto);
  padding: 40px 20px calc(40px + env(safe-area-inset-bottom, 0px));
  position: relative; overflow: hidden;
  background-size: cover; background-position: center;
}
.hero::before { content: ""; position: absolute; inset: 12px; border: 1px solid var(--borda-glass); pointer-events: none; z-index: 2; }

.hero .conteudo-topo {
  position: relative; z-index: 3; width: 100%; max-width: 420px;
  margin-top: 20px;
}
.hero .tag-15 { font-family: var(--fonte-titulo); font-size: 0.95rem; letter-spacing: 0.3em; color: var(--pink-bouganville); text-transform: uppercase; font-weight: 600; }

.hero h1.nome-texto {
  font-family: var(--fonte-nome); font-size: clamp(2.8rem, 12vw, 4.2rem);
  line-height: 1.1; margin: 10px 0 0; color: var(--azul-cobalto);
  letter-spacing: 0.02em; filter: drop-shadow(0 2px 8px rgba(255, 255, 255, 0.8));
}

.hero .conteudo-bottom {
  position: relative; z-index: 3; width: 100%; max-width: 420px;
  margin-top: auto;
  padding-bottom: 10px;
}
.hero .data { font-family: var(--fonte-titulo); font-size: 1.1rem; letter-spacing: 0.1em; color: var(--azul-greco); font-weight: 600; margin-bottom: 14px; text-transform: uppercase; }

.contagem { display: flex; gap: 8px; justify-content: center; }
.contagem div {
  min-width: 58px; padding: 10px 4px;
  background: var(--fundo-card); backdrop-filter: blur(8px);
  border: 1px solid var(--borda-glass); border-radius: 10px;
  box-shadow: 0 4px 15px rgba(27, 73, 101, 0.08);
}
.contagem b { display: block; font-family: var(--fonte-titulo); font-size: 1.4rem; font-weight: 600; color: var(--azul-greco); }
.contagem span { font-size: 0.62rem; text-transform: uppercase; color: var(--pink-bouganville); letter-spacing: 0.05em; font-weight: 600; }

/* ---------- Estrutura das Secções ---------- */
section.sec { padding: 64px 20px; position: relative; }
section.sec.alt { background: rgba(27, 73, 101, 0.03); }
.wrap { max-width: 480px; margin: 0 auto; }
h2 { font-family: var(--fonte-titulo); font-weight: 600; font-size: 1.8rem; text-align: center; color: var(--azul-cobalto); letter-spacing: 0.05em; }
.ornamento { width: 50px; height: 1px; background: var(--pink-bouganville); margin: 8px auto 28px; position: relative; }
.ornamento::after { content: "🌸"; position: absolute; left: 50%; top: -12px; font-size: 10px; transform: translateX(-50%); }
.texto { font-size: 1.05rem; line-height: 1.7; text-align: center; color: var(--texto-suave); font-weight: 400; }

.glass-card {
  background: var(--fundo-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--borda-glass); border-radius: 16px; padding: 24px 20px;
  box-shadow: var(--sombra-glow); margin-top: 20px; text-align: center;
}

.foto-debutante {
  width: 100%; max-width: 300px; aspect-ratio: 9/16; object-fit: cover;
  margin: 24px auto 0; border-radius: 150px 150px 16px 16px;
  border: 3px solid var(--azul-greco); padding: 5px; background: #fff;
  box-shadow: 0 8px 25px rgba(27, 73, 101, 0.2);
}

.video-box {
  width: 100%; max-width: 320px; aspect-ratio: 9/16; margin: 0 auto;
  border-radius: 16px; overflow: hidden; border: 2px solid var(--azul-greco);
  box-shadow: var(--sombra-glow); background: #000;
}
.video-box iframe { width: 100%; height: 100%; border: 0; }

.botoes { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 14px 20px; border-radius: 10px;
  background: linear-gradient(135deg, var(--azul-greco), var(--azul-cobalto));
  color: #ffffff; text-decoration: none;
  font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.08em;
  box-shadow: 0 4px 15px rgba(27, 73, 101, 0.25); transition: transform 0.2s;
}
.btn:active { transform: scale(0.97); }
.btn.vazado { background: transparent; color: var(--azul-cobalto); border: 1.5px solid var(--azul-cobalto); box-shadow: none; }

form { display: grid; gap: 14px; margin-top: 10px; text-align: left; }
label { display: grid; gap: 4px; font-size: 0.85rem; color: var(--azul-cobalto); font-weight: 600; }
input, select, textarea {
  font: inherit; padding: 12px; border: 1px solid var(--borda-glass); border-radius: 8px;
  background: #ffffff; color: var(--texto-escuro); width: 100%;
}
textarea { min-height: 80px; }

/* Rodapé e Logo PNG */
footer { background: var(--azul-cobalto); color: #ffffff; text-align: center; padding: 48px 20px calc(48px + env(safe-area-inset-bottom, 0px)); }
footer .nome { font-family: var(--fonte-nome); font-size: 2.8rem; color: #ffffff; }
footer .logo-png { max-width: 260px; height: auto; margin: 0 auto; display: block; }

#yt-player-container { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; left: -9999px; }

.rv { opacity: 0; transform: translateY(20px); transition: opacity 0.8s ease, transform 0.8s ease; }
.rv.in { opacity: 1; transform: translateY(0); }
</style>
</head>

<body class="locked">

<!-- Camada do Pattern / Azulejo Greco -->
<div id="pattern-bg"></div>

<!-- Player do YouTube (áudio, invisível) -->
<div id="yt-player-container"><div id="yt-player"></div></div>

<div id="intro" role="dialog"></div>
<main id="app"></main>

<script>
/* ==========================================================================
   ✏️ CONFIGURAÇÕES DO CONVITE (SANTORINI / MAMMA MIA)
   ========================================================================== */
const CONFIG = {
  nome: "", // Nome do texto padrao

  /* 🖼️ URL DA IMAGEM PNG DO NOME DA CLIENTE (EM BRANCO) */
  logoNome: "https://github.com/maricriative/Convite-Giovanna-15-Anos-/blob/main/FUNDO%20TRANSPARENTE-08.png?raw=true",

  fundoPattern: "https://github.com/maricriative/Convite-Giovanna-15-Anos-/blob/main/FUNDO%20TRANSPARENTE-15.png?raw=true",

  /* ✉️ TELA DE ABERTURA INICIAL
     Enquanto não houver imagem, aparece o fundo azul #0F3057.
     Cole aqui a URL da nova imagem de entrada quando estiver pronta. */
  imagemAbertura: "https://github.com/maricriative/Convite-Giovanna-15-Anos-/blob/main/ImgAbertura.jpg?raw=true",
  videoAbertura: "",

  frase: "Here we go again! Venha celebrar meus 15 Anos em uma noite inesquecível.",

  dataHora: "2027-01-09T20:00:00",
  cidade: "Brasília - DF",

  youtubeAudioUrl: "https://youtu.be/pLjPUSyUzvQ?si=HhgwzrAFDEvsV-u8",

  usarTelaDeAbertura: true,

  fotoCapa: "https://github.com/maricriative/Convite-Giovanna-15-Anos-/blob/main/Capa01.png?raw=true",
  fotoDebutante: "https://github.com/maricriative/Convite-Giovanna-15-Anos-/blob/main/FotoGigi.jpeg?raw=true",

  videoTeaser: "Videogigi.mp4",

  mensagem: {
    titulo: "Meus 15 Anos",
    texto: "Inspirada pela magia das ilhas gregas e pela alegria de Mamma Mia, convido você para celebrar o início deste novo capítulo comigo!"
  },

  local: {
    titulo: "Recepção & Festa",
    horario: "20h00",
    espaco: "Villa Santorini",
    endereco: "Setor de Mansões Dom Bosco - Brasília/DF",
    mapsUrl: "", wazeUrl: ""
  },

  programacao: [
    { hora: "20h00", titulo: "Boas-vindas à Grécia" },
    { hora: "21h30", titulo: "Entrada & Valsa da Debutante" },
    { hora: "22h30", titulo: "Jantar Mediterrâneo" },
    { hora: "23h30", titulo: "Pista Mamma Mia (Dancing Queen)" }
  ],

  dressCode: {
    titulo: "Dress Code",
    texto: "Esporte Fino"
  },

  rsvp: {
    whatsapp: "5561992347099",
    prazo: "23 de Dezembro"
  },

  hashtag: "#GiovannaXV"
};

/* ==========================================================================
   ⚙️ EXECUÇÃO & LÓGICA
   ========================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const C = CONFIG;
const data = new Date(C.dataHora);
const fmt = (o) => new Intl.DateTimeFormat('pt-BR', o).format(data);

const capitalizar = (str) => str.charAt(0).toUpperCase() + str.slice(1);

const dataLonga = fmt({ day: 'numeric', month: 'long', year: 'numeric' });
const diaSemana = capitalizar(fmt({ weekday: 'long' }));
const enc = encodeURIComponent;

document.title = `${C.nome || '15 Anos'} — XV Anos`;

if (C.fundoPattern) {
  $('#pattern-bg').style.backgroundImage = `url("${C.fundoPattern}")`;
}

function extrairIdYoutube(url) {
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : url;
}

/* API YouTube (áudio de fundo) */
let ytPlayer = null;

const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  const videoId = extrairIdYoutube(C.youtubeAudioUrl);
  if (!videoId) return;

  ytPlayer = new YT.Player('yt-player', {
    videoId: videoId,
    playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': videoId }
  });
}

/* ---------- TELA DE ABERTURA INICIAL ---------- */
const intro = $('#intro');
if (C.usarTelaDeAbertura) {
  if (C.imagemAbertura) {
    intro.style.backgroundImage = `url("${C.imagemAbertura}")`;
  }

  intro.innerHTML = `
    ${C.videoAbertura ? `<video id="videoAberturaPlayer" src="${C.videoAbertura}" playsinline></video>` : ''}
    <button class="area-selo-clique" id="abrir" aria-label="Abrir Convite"></button>
  `;
} else { intro.remove(); }

function fecharAberturaEEntrar() {
  intro.classList.add('open');
  document.body.classList.remove('locked');

  if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
    ytPlayer.playVideo();
  }

  setTimeout(() => intro.remove(), 1100);
}

if (C.usarTelaDeAbertura) {
  $('#abrir').onclick = () => {
    const videoPlayer = $('#videoAberturaPlayer');
    if (videoPlayer) {
      videoPlayer.style.display = 'block';
      videoPlayer.play();
      videoPlayer.onended = fecharAberturaEEntrar;
      videoPlayer.onclick = fecharAberturaEEntrar;
    } else {
      fecharAberturaEEntrar();
    }
  };
} else {
  document.body.classList.remove('locked');
}

/* Construção das Secções */
const secoes = [];
function add(id, html, alt) {
  secoes.push(`<section class="sec${alt ? ' alt' : ''}" id="${id}"><div class="wrap">${html}</div></section>`);
}
const titulo = t => `<h2>${t}</h2><div class="ornamento"></div>`;

/* Capa */
const capa = `
<header class="hero" id="inicio" style="background-image:url('${C.fotoCapa}')">
  <div class="conteudo-topo">
    <p class="tag-15"></p>
    ${C.nome ? `<h1 class="nome-texto">${C.nome}</h1>` : ''}
  </div>

  <div class="conteudo-bottom">
    <p class="data">${diaSemana}, ${dataLonga}</p>
    <div id="contagem"></div>
  </div>
</header>`;

if (C.mensagem) add('convite', `
  ${titulo(C.mensagem.titulo)}
  <p class="texto">${C.mensagem.texto}</p>
  ${C.fotoDebutante ? `<img class="foto-debutante" src="${C.fotoDebutante}" alt="${C.nome}">` : ''}`);

if (C.videoTeaser) {
  const vId = extrairIdYoutube(C.videoTeaser);
  if (vId) add('video', `
    ${titulo('Teaser')}
    <div class="video-box"><iframe src="https://www.youtube.com/embed/${vId}?rel=0" allowfullscreen loading="lazy"></iframe></div>`);
}

if (C.local) add('local', `
  ${titulo('Onde & Quando')}
  <p class="texto">${diaSemana}, ${dataLonga}</p>
  <div class="glass-card">
    <h3 style="font-family:var(--fonte-titulo); font-size:1.4rem; color:var(--azul-cobalto);">${C.local.titulo}</h3>
    <p style="color:var(--pink-bouganville); font-weight:600; font-size:1.1rem; margin:6px 0;">${C.local.horario}</p>
    <p style="font-weight:600; color:var(--azul-greco);">${C.local.espaco}</p>
    <p style="font-size:0.88rem; opacity:0.85; margin-bottom:14px;">${C.local.endereco}</p>
    <div class="botoes">
      <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${enc(C.local.espaco + ' ' + C.local.endereco)}" target="_blank">Google Maps</a>
      <a class="btn vazado" href="https://waze.com/ul?q=${enc(C.local.endereco)}&navigate=yes" target="_blank">Waze</a>
    </div>
  </div>`);

if (C.programacao && C.programacao.length) add('programacao', `
  ${titulo('Programação')}
  <div class="glass-card" style="text-align:left;">
    ${C.programacao.map(p => `
      <div style="display:flex; gap:16px; margin-bottom:12px; align-items:center;">
        <span style="color:var(--pink-bouganville); font-family:var(--fonte-titulo); font-weight:700;">${p.hora}</span>
        <span style="font-size:0.95rem; font-weight:500;">${p.titulo}</span>
      </div>`).join('')}
  </div>`, true);

if (C.dressCode) add('traje', `
  ${titulo(C.dressCode.titulo)}
  <p class="texto">${C.dressCode.texto}</p>`);

if (C.rsvp && C.rsvp.whatsapp) add('confirmar', `
  ${titulo('Confirmar Presença')}
  <p class="texto" style="font-size:0.95rem;">Favor confirmar até <b>${C.rsvp.prazo}</b></p>
  <form id="formRsvp">
    <label>Seu Nome Completo <input name="nome" required autocomplete="name"></label>
    <label>Você irá comparecer?
      <select name="presenca">
        <option value="sim">Sim! Estarei lá para celebrar</option>
        <option value="nao">Infelizmente não poderei ir</option>
      </select>
    </label>
    <label>Mensagem para a Debutante <textarea name="recado"></textarea></label>
    <button class="btn" type="submit">Confirmar no WhatsApp</button>
  </form>`, true);

/* Rodapé */
const logoHtml = C.logoNome
  ? `<img src="${C.logoNome}" alt="${C.nome}" class="logo-png">`
  : `<div class="nome">${C.nome || 'Giovanna'}</div>`;

const rodape = `
<footer>
  ${logoHtml}
  <p style="color:var(--pink-bouganville); margin:6px 0 0; font-weight:600;">${C.hashtag}</p>
</footer>`;

$('#app').innerHTML = capa + secoes.join('') + rodape;

/* Revelar ao rolar */
const rvs = document.querySelectorAll('section.sec .wrap, footer');
rvs.forEach(e => e.classList.add('rv'));
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: 0.1 });
  rvs.forEach(e => io.observe(e));
} else rvs.forEach(e => e.classList.add('in'));

function atualizaContagem() {
  const el = $('#contagem'); const dif = data - new Date();
  if (dif <= 0) { el.innerHTML = '<p style="margin-top:20px; font-family:var(--fonte-titulo); font-size:1.3rem; color:var(--pink-bouganville);">É HOJE A FESTA!</p>'; return; }
  const d = Math.floor(dif / 864e5), h = Math.floor(dif % 864e5 / 36e5), m = Math.floor(dif % 36e5 / 6e4), s = Math.floor(dif % 6e4 / 1e3);
  el.className = 'contagem';
  el.innerHTML = [[d, 'dias'], [h, 'hs'], [m, 'min'], [s, 'seg']].map(([n, t]) => `<div><b>${String(n).padStart(2, '0')}</b><span>${t}</span></div>`).join('');
}
atualizaContagem(); setInterval(atualizaContagem, 1000);

const form = $('#formRsvp');
if (form) {
  form.onsubmit = e => {
    e.preventDefault();
    const f = new FormData(form), vai = f.get('presenca') === 'sim';
    let msg = `Olá! Sou ${f.get('nome')}. ` + (vai ? `Confirmo minha presença nos 15 Anos da ${C.nome || 'Giovanna'}!` : `Infelizmente não poderei comparecer.`);
    if (f.get('recado')) msg += `\nRecado: ${f.get('recado')}`;
    open(`https://wa.me/${C.rsvp.whatsapp}?text=${enc(msg)}`, '_blank');
  };
}
</script>
</body>
</html>
